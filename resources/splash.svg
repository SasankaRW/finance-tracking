<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#163832" />
      <stop offset="50%" stop-color="#1f5c4a" />
      <stop offset="100%" stop-color="#2f8f6b" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#g)" />
  <!-- Scaled down and kept tight to center: a square master gets center-cropped
       to whatever aspect ratio a given phone screen needs, so the mark must
       survive the narrowest realistic portrait crop without clipping. -->
  <g transform="translate(50,50) scale(0.5) translate(-50,-50)">
    <rect x="27" y="24" width="46" height="20" rx="10" fill="#ffffff" opacity="0.45" />
    <rect x="18" y="34" width="64" height="42" rx="14" fill="#ffffff" />
    <circle cx="30" cy="55" r="4.2" fill="#2f8f6b" />
    <rect x="44" y="42" width="8" height="16" rx="3" fill="#ffd9a0" />
    <rect x="55" y="34" width="8" height="24" rx="3" fill="#ffd9a0" />
    <rect x="66" y="24" width="8" height="34" rx="3" fill="#ffd9a0" />
  </g>
</svg>
